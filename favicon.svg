<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<rect width="100" height="100" rx="18" fill="#0057FF"/>
<style>
.bl{stroke:#1a3a6e;stroke-width:2;fill:none;stroke-linecap:round}
.pl{stroke:#00C8F0;stroke-width:2.5;fill:none;stroke-linecap:round}
.dd{fill:#00FFB2}
.pt{fill:white;font-family:Arial,sans-serif;font-weight:800;font-size:14px}
#pv{stroke-dasharray:10 60;animation:fv 1.4s linear infinite}
#ph1{stroke-dasharray:10 50;animation:fh 1.1s linear infinite 0s}
#ph2{stroke-dasharray:10 50;animation:fh2 1.1s linear infinite .35s}
#ph3{stroke-dasharray:10 50;animation:fh 1.1s linear infinite .7s}
@keyframes fv{from{stroke-dashoffset:70}to{stroke-dashoffset:0}}
@keyframes fh{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
@keyframes fh2{from{stroke-dashoffset:-60}to{stroke-dashoffset:0}}
.dd{animation:gd 1.2s ease-in-out infinite alternate}
@keyframes gd{from{opacity:.3;r:4}to{opacity:1;r:5.5}}
</style>
<line class="bl" x1="55" y1="15" x2="55" y2="85"/>
<line class="bl" x1="20" y1="30" x2="80" y2="30"/>
<line class="bl" x1="20" y1="55" x2="80" y2="55"/>
<line class="bl" x1="20" y1="78" x2="80" y2="78"/>
<line id="pv" class="pl" x1="55" y1="15" x2="55" y2="85"/>
<line id="ph1" class="pl" x1="20" y1="30" x2="80" y2="30"/>
<line id="ph2" class="pl" x1="80" y1="55" x2="20" y2="55"/>
<line id="ph3" class="pl" x1="20" y1="78" x2="80" y2="78"/>
<circle class="dd" cx="35" cy="30" r="5"/>
<circle class="dd" cx="70" cy="55" r="5"/>
<circle class="dd" cx="55" cy="78" r="5"/>
<text class="pt" x="50" y="59" text-anchor="middle">PBP</text>
</svg>
